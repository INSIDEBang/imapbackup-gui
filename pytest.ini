# 测试套件配置。仓库不是可安装包，所以不建 pyproject.toml —— 这份配置只服务 pytest。
#
# testpaths 不是可有可无：pytest 默认收集 *_test.py，而 .scratch/ 里那几个已退役的
# 一次性脚本（eml-output/smoke_test.py 等）恰好命中这个命名，它们不是 pytest 函数，
# 不指到 tests/ 会直接报错。

[pytest]
testpaths = tests
pythonpath = .
markers =
    gui: 需要真实 Tk 显示与 ttk 主题（GUI 冒烟）；无显示环境的 runner 用 -m "not gui" 跳过
